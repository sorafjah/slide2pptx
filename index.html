<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スライドメーカーPPTX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
            --slide-width: 960px; /* 16:9 ratio base */
            --slide-height: 540px;
            --danger-color: #f97316; /* Orange for delete */
        }

        body {
            font-family: 'BIZ UDPGothic', 'Meiryo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.25rem; }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        /* Changed to Orange */
        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: #ea580c; }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Panel: Slide List */
        .sidebar {
            width: 250px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .slide-thumbnail {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .slide-thumbnail.active {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary-color);
        }
        .thumb-num { font-weight: bold; color: #94a3b8; width: 1.5em; }
        .slide-thumbnail p { margin: 0; font-size: 0.85rem; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;}

        .sidebar-controls {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: grid;
            gap: 0.5rem;
        }

        /* Center: Editor */
        .editor-area {
            flex: 1;
            padding: 2rem;
            display: flex;
            gap: 2rem;
            overflow-y: auto;
            justify-content: center;
        }

        .input-group {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* Increased gap */
        }
        
        label { font-size: 0.85rem; font-weight: bold; margin-bottom: 0.25rem; display: block; }
        textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            resize: vertical;
            min-height: 200px; /* Taller text area */
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            padding: 1.5rem 1rem;
            text-align: center;
            border-radius: 4px;
            background: #f8fafc;
            color: #64748b;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-upload-box:hover { border-color: var(--primary-color); background: #f1f5f9; }
        input[type="file"] { display: none; }

        /* Preview Slide */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .slide-preview {
            width: var(--slide-width);
            height: var(--slide-height);
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            transform-origin: top center;
        }
        
        /* Slide Layout: 16:9 Simple Business Style (No Title) */
        .slide-content {
            padding: 40px;
            width: 100%;
            height: 100%;
            display: flex; /* Changed to flex for centering content */
            flex-direction: column;
            justify-content: center; /* Vertically center */
            box-sizing: border-box;
        }

        .slide-body {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr; /* Text : Image */
            gap: 30px;
            align-items: center; /* Vertically center items */
            height: 100%;
        }
        
        .slide-text {
            font-size: 1.8rem; /* Slightly larger font */
            line-height: 1.5;
            white-space: pre-wrap;
            /* Ensure text doesn't overflow awkwardly */
            max-height: 100%;
            overflow-y: hidden;
        }

        .slide-image-area {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .slide-image-area img {
            max-width: 100%;
            max-height: 440px; /* Increased max height */
            object-fit: contain;
            /* border: 1px solid #eee; Removed border */
        }

        /* JSON Import/Export Modal */
        #jsonModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 1400px) {
            .slide-preview {
                transform: scale(0.65);
                margin-bottom: -180px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>スライドメーカーPPTX</h1>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-outline" onclick="toggleJsonModal()">JSON入出力</button>
        <button class="btn" onclick="exportPPTX()">PPTXをダウンロード</button>
    </div>
</header>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-controls">
            <button class="btn" onclick="addNewSlide()">＋ 新規スライド</button>
            <button class="btn btn-danger" onclick="deleteCurrentSlide()">削除</button>
        </div>
        <div id="slideListContainer" style="flex:1;">
            </div>
    </div>

    <div class="editor-area">
        <div class="input-group">
            <div>
                <label>本文 (改行可)</label>
                <textarea id="inputText" oninput="updateCurrentSlideData()" placeholder="ここにスライドの内容を入力してください..."></textarea>
            </div>
            <div>
                <label>画像</label>
                <label class="file-upload-box" for="imageInput" id="fileDropArea">
                    ファイルを選択<br>または<br>ここに画像をペースト (Ctrl+V)
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect(event)">
                <button class="btn btn-outline" style="width:100%; margin-top:5px; font-size:0.85rem;" onclick="clearImage()">画像を削除</button>
            </div>
        </div>

        <div class="preview-container">
            <div class="slide-preview" id="slidePreview">
                <div class="slide-content">
                    <div class="slide-body">
                        <div class="slide-text" id="previewText">本文</div>
                        <div class="slide-image-area" id="previewImageArea">
                            </div>
                    </div>
                </div>
            </div>
            <p style="font-size:0.8rem; color:#64748b;">※フォントは「BIZ UDPGothic」を使用しています (16:9)</p>
        </div>
    </div>
</div>

<div id="jsonModal">
    <div class="modal-content">
        <h3>スライドJSON</h3>
        <p style="font-size:0.9rem; color:#64748b;">テキストエリアにJSONを貼り付けて「読み込み」を押すか、現在のデータをコピーしてください。</p>
        <textarea id="jsonArea" style="width:100%; height:200px; font-family:monospace; border:1px solid var(--border-color); padding:0.5rem;"></textarea>
        <div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-outline" onclick="toggleJsonModal()">閉じる</button>
            <button class="btn" onclick="loadJsonData()">読み込み</button>
            <button class="btn" onclick="copyJsonData()">コピー</button>
        </div>
    </div>
</div>

<script>
    // --- State Management ---
    // Title field removed from data structure
    let slides = [
        {
            content: "ここに本文を入力してください。\n\n・箇条書き1\n・箇条書き2\n・箇条書き3",
            image: null // Base64 string
        }
    ];
    let currentIndex = 0;

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        renderSlideList();
        loadSlideToEditor();
        
        // Paste Event Listener for Images
        document.addEventListener('paste', handlePaste);
    });

    // --- Core Functions ---

    function addNewSlide() {
        slides.push({
            content: "新しいスライドの内容",
            image: null
        });
        currentIndex = slides.length - 1;
        renderSlideList();
        loadSlideToEditor();
    }

    function deleteCurrentSlide() {
        if (slides.length <= 1) {
            alert("これ以上削除できません。少なくとも1枚のスライドが必要です。");
            return;
        }
        if (confirm("現在のスライドを削除しますか？")) {
            slides.splice(currentIndex, 1);
            if (currentIndex >= slides.length) {
                currentIndex = slides.length - 1;
            }
            renderSlideList();
            loadSlideToEditor();
        }
    }

    function selectSlide(index) {
        currentIndex = index;
        renderSlideList(); // Update active class
        loadSlideToEditor();
    }

    // --- Rendering ---

    function renderSlideList() {
        const container = document.getElementById('slideListContainer');
        container.innerHTML = '';
        slides.forEach((slide, index) => {
            const div = document.createElement('div');
            div.className = `slide-thumbnail ${index === currentIndex ? 'active' : ''}`;
            div.onclick = () => selectSlide(index);
            // Display slide number and first line of content
            let previewText = slide.content.split('\n')[0] || '(空白)';
            if (previewText.length > 15) previewText = previewText.substring(0, 15) + '...';

            div.innerHTML = `
                <span class="thumb-num">${index + 1}</span>
                <p>${previewText}</p>
            `;
            container.appendChild(div);
        });
    }

    function loadSlideToEditor() {
        const slide = slides[currentIndex];
        // document.getElementById('inputTitle').value = slide.title; // Removed
        document.getElementById('inputText').value = slide.content;
        updatePreview();
    }

    function updateCurrentSlideData() {
        // slides[currentIndex].title = document.getElementById('inputTitle').value; // Removed
        slides[currentIndex].content = document.getElementById('inputText').value;
        updatePreview();
        renderSlideList(); // Refresh thumbnail list to show updated content
    }

    function updatePreview() {
        const slide = slides[currentIndex];
        // document.getElementById('previewTitle').innerText = slide.title; // Removed
        document.getElementById('previewText').innerText = slide.content;
        
        const imgContainer = document.getElementById('previewImageArea');
        imgContainer.innerHTML = '';
        if (slide.image) {
            const img = document.createElement('img');
            img.src = slide.image;
            imgContainer.appendChild(img);
            
            // Change layout class if image exists (optional, using CSS grid instead)
            // document.querySelector('.slide-body').classList.add('has-image');
        } else {
            // document.querySelector('.slide-body').classList.remove('has-image');
        }
    }

    // --- Image Handling (File & Paste) ---

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        processImageFile(file);
        event.target.value = ''; // Reset input
    }

    function handlePaste(event) {
        const items = (event.clipboardData || event.originalEvent.clipboardData).items;
        for (let index in items) {
            const item = items[index];
            if (item.kind === 'file' && item.type.startsWith('image/')) {
                const blob = item.getAsFile();
                processImageFile(blob);
                event.preventDefault(); // Prevent double paste in inputs
                return; // Only take the first image
            }
        }
    }

    function processImageFile(file) {
        // Basic validation
        if (file.size > 5 * 1024 * 1024) { // 5MB limit check
             alert("画像サイズが大きすぎます (5MB以下推奨)");
             // return; // Uncomment to enforce limit
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            slides[currentIndex].image = e.target.result; // Base64
            updatePreview();
        };
        reader.onerror = () => {
            alert("画像の読み込みに失敗しました。");
        };
        reader.readAsDataURL(file);
    }

    function clearImage() {
        slides[currentIndex].image = null;
        updatePreview();
    }

    // --- PPTX Export (Fixed & Updated Layout) ---

    async function exportPPTX() {
        const btn = document.querySelector('header .btn:last-child');
        const originalText = btn.innerText;
        btn.innerText = '作成中...';
        btn.disabled = true;

        try {
            // Initialize PptxGenJS
            let pptx = new PptxGenJS();
            
            // Font Settings
            const fontFace = "BIZ UDPGothic"; 

            // Layout (16:9)
            pptx.layout = 'LAYOUT_16x9';

            slides.forEach((slide) => {
                let slidePage = pptx.addSlide();

                // Background / Color
                slidePage.background = { color: "FFFFFF" };
                
                // Content Layout (No Title)
                if (slide.image) {
                    // Two column layout: Text Left, Image Right
                    // Vertically centered approx.
                    slidePage.addText(slide.content, {
                        x: 0.5, y: 0.5, w: 5.0, h: 6.5, // Left half
                        fontSize: 24, // Larger font
                        fontFace: fontFace,
                        color: '334155',
                        valign: 'middle',
                        align: 'left'
                    });
                    slidePage.addImage({
                        data: slide.image,
                        x: 5.8, y: 0.5, w: 4.0, h: 6.5, // Right half
                        sizing: { type: "contain", w: 4.0, h: 6.5 }
                    });
                } else {
                    // Full width text, centered
                    slidePage.addText(slide.content, {
                        x: 1.0, y: 0.5, w: 8.0, h: 6.5,
                        fontSize: 28,
                        fontFace: fontFace,
                        color: '334155',
                        valign: 'middle',
                        align: 'center'
                    });
                }
            });

            // Save File
            await pptx.writeFile({ fileName: `Slide_${new Date().toISOString().slice(0,10)}.pptx` });

        } catch (error) {
            console.error("PPTX Export Error:", error);
            alert("PPTXの作成に失敗しました。\nエラー: " + error.message);
        } finally {
             btn.innerText = originalText;
             btn.disabled = false;
        }
    }

    // --- JSON Import/Export ---

    function toggleJsonModal() {
        const modal = document.getElementById('jsonModal');
        const jsonArea = document.getElementById('jsonArea');
        
        if (modal.style.display === 'flex') {
            modal.style.display = 'none';
        } else {
            // Show modal and fill current data
            jsonArea.value = JSON.stringify(slides, null, 2);
            modal.style.display = 'flex';
        }
    }

    function loadJsonData() {
        const jsonArea = document.getElementById('jsonArea');
        try {
            // Basic JSON validation
            const jsonString = jsonArea.value.trim();
            if (!jsonString) { throw new Error("データが空です"); }

            const data = JSON.parse(jsonString);
            
            // Validate data structure
            if (!Array.isArray(data)) {
                throw new Error("データの形式が正しくありません (配列形式が必要です)");
            }
            if (data.length === 0 || !data[0].hasOwnProperty('content')) {
                 throw new Error("有効なスライドデータが含まれていません");
            }

            slides = data;
            // Ensure image field exists if missing in older JSON
            slides.forEach(s => { if(!s.hasOwnProperty('image')) s.image = null; });

            currentIndex = 0;
            renderSlideList();
            loadSlideToEditor();
            toggleJsonModal();
            alert("データを読み込みました。");

        } catch (e) {
            alert("JSONの読み込みに失敗しました:\n" + e.message);
        }
    }

    async function copyJsonData() {
        const jsonArea = document.getElementById('jsonArea');
        try {
            await navigator.clipboard.writeText(jsonArea.value);
            alert("クリップボードにコピーしました");
        } catch (err) {
            // Fallback for older browsers or insecure contexts
            jsonArea.select();
            document.execCommand('copy');
            alert("クリップボードにコピーしました (Fallback)");
        }
    }

</script>
</body>
</html>
